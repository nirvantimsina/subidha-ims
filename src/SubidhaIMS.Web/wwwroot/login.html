<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Subidha IMS</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/vendor/tailwindcss.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            headline: ["'Plus Jakarta Sans'", "sans-serif"],
            body: ["'Plus Jakarta Sans'", "sans-serif"],
            mono: ["'Roboto Mono'", "monospace"]
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 font-body min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl w-full max-w-sm p-8 shadow-2xl border border-slate-800">
    <div class="text-center mb-6">
      <div class="inline-flex p-3 bg-emerald-50 text-emerald-700 rounded-xl mb-3">
        <span class="material-symbols-outlined text-3xl">inventory_2</span>
      </div>
      <h2 class="font-headline text-xl font-bold text-slate-900">Subidha IMS</h2>
      <p class="text-xs text-slate-500 mt-1">Retail Electronics ERP • Offline Local Node</p>
    </div>

    <div id="login-alert" class="hidden mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg text-xs font-medium"></div>

    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Username</label>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3 text-slate-400 text-lg">person</span>
          <input type="text" id="username" class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium text-slate-900 focus:bg-white focus:border-emerald-600 focus:outline-none" placeholder="admin" required autocomplete="username" autofocus>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Password</label>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3 text-slate-400 text-lg">key</span>
          <input type="password" id="password" class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium text-slate-900 focus:bg-white focus:border-emerald-600 focus:outline-none" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="submitBtn" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-headline text-xs font-bold rounded-lg shadow-sm shadow-emerald-500/20 transition-all flex items-center justify-center gap-2">
        <span id="btnText">Sign In to Dashboard</span>
        <span id="btnSpinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-100 text-center text-slate-400 text-[11px] font-mono flex items-center justify-center gap-1">
      <span class="material-symbols-outlined text-sm">wifi_off</span>
      <span>Works 100% Offline (LAN Only)</span>
    </div>
  </div>

  <script>
    fetch('/api/auth/me').then(res => {
      if (res.ok) window.location.href = '/';
    });

    async function handleLogin(e) {
      e.preventDefault();
      const alertBox = document.getElementById('login-alert');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      alertBox.classList.add('hidden');
      submitBtn.disabled = true;
      btnText.classList.add('hidden');
      btnSpinner.classList.remove('hidden');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.message || 'Invalid username or password');
        }

        window.location.href = '/';
      } catch (err) {
        alertBox.innerText = err.message;
        alertBox.classList.remove('hidden');
        submitBtn.disabled = false;
        btnText.classList.remove('hidden');
        btnSpinner.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
