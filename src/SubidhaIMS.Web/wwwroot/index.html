<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subidha IMS - Inventory &amp; Billing</title>

  <!-- Browser Tab Favicon -->
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="apple-touch-icon" href="/images/logo.png">
  
  <!-- 1. All Local Fonts, Ligatures, & Icons -->
  <link rel="stylesheet" href="/css/app.css">

  <!-- 2. Local Standalone Tailwind Engine -->
  <script src="/js/vendor/tailwindcss.js"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              900: '#064e3b',
            },
            surface: {
              base: '#f8fafc',
              card: '#ffffff',
              border: '#cbd5e1',
              muted: '#f1f5f9'
            }
          },
          fontFamily: {
            headline: ["'Plus Jakarta Sans'", "system-ui", "-apple-system", "sans-serif"],
            body: ["'Plus Jakarta Sans'", "system-ui", "-apple-system", "sans-serif"],
            mono: ["'Roboto Mono'", "monospace"]
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface-base font-body text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Left Sidebar Navigation -->
  <aside class="fixed left-0 top-0 h-full w-64 bg-white border-r border-slate-200 z-50 flex flex-col justify-between py-4 shadow-sm">
    <div class="flex flex-col">
      <!-- Brand Logo / Header -->
      <div class="px-5 pb-5 flex items-center gap-3 border-b border-slate-100">
        <div class="w-9 h-9 rounded-lg bg-white flex items-center justify-center p-1 border border-slate-200 shadow-xs shrink-0 overflow-hidden">
          <img src="/images/logo.png" 
               alt="Subidha IMS Logo" 
               class="w-full h-full object-contain" />
        </div>
        <div class="flex flex-col">
          <span class="font-headline text-lg font-bold text-slate-900 tracking-tight leading-none uppercase">Subidha IMS</span>
        </div>
      </div>

      <!-- Facility / Store Switcher Tag -->
      <div class="px-4 py-3">
        <div class="bg-slate-50 border border-slate-200/80 px-3 py-2 rounded-lg flex items-center justify-between">
          <div class="flex flex-col min-w-0">
            <span class="font-mono text-[10px] text-slate-400 uppercase tracking-wider">Active Store</span>
            <span class="text-xs font-semibold text-slate-700 truncate" id="sidebar-shop-name">Subidha Electronics</span>
          </div>
          <span class="material-symbols-outlined text-slate-400 text-sm">storefront</span>
        </div>
      </div>

      <!-- Main Navigation Items -->
      <nav class="px-3 space-y-1 mt-1 text-sm font-medium">
        <a href="#dashboard" data-view="dashboard" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all text-slate-600 hover:text-slate-900 hover:bg-slate-100">
          <span class="material-symbols-outlined text-lg">dashboard</span>
          <span>Dashboard</span>
        </a>
        <a href="#pos" data-view="pos" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all text-emerald-700 bg-emerald-50 hover:bg-emerald-100 font-semibold">
          <span class="material-symbols-outlined text-lg">point_of_sale</span>
          <span>POS Billing</span>
        </a>
        <a href="#sales" data-view="sales" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all text-slate-600 hover:text-slate-900 hover:bg-slate-100">
          <span class="material-symbols-outlined text-lg">receipt_long</span>
          <span>Sales Book</span>
        </a>
        <a href="#purchases" data-view="purchases" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all text-slate-600 hover:text-slate-900 hover:bg-slate-100">
          <span class="material-symbols-outlined text-lg">local_shipping</span>
          <span>Purchase Book</span>
        </a>
        <a href="#stock" data-view="stock" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all text-slate-600 hover:text-slate-900 hover:bg-slate-100">
          <span class="material-symbols-outlined text-lg">shelves</span>
          <span>Stock Book</span>
        </a>
        <a href="#settings" data-view="settings" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all text-slate-600 hover:text-slate-900 hover:bg-slate-100">
          <span class="material-symbols-outlined text-lg">tune</span>
          <span>Settings &amp; Masters</span>
        </a>
      </nav>
    </div>
  </aside>

  <!-- Top Fixed Header -->
  <div class="pl-64 flex-1">
    <!-- Inside the top fixed header of wwwroot/index.html -->
<header class="fixed top-0 left-64 right-0 h-16 bg-white/90 backdrop-blur-md border-b border-slate-200/80 z-40 flex items-center justify-between px-8">
  <!-- Search Input -->
  <div class="flex items-center gap-3 w-80">
    <div class="w-full flex items-center gap-2 bg-slate-100/80 border border-slate-200/60 px-3 py-1.5 rounded-lg text-slate-400 focus-within:border-emerald-500 focus-within:bg-white transition-all">
      <span class="material-symbols-outlined text-sm">search</span>
      <input id="global-search" class="bg-transparent border-none outline-none text-xs text-slate-800 w-full placeholder:text-slate-400 font-medium" placeholder="Quick Search (Barcode, SKU, Name)..." type="text"/>
      <kbd class="font-mono text-[10px] px-1.5 py-0.5 bg-white border border-slate-200 text-slate-500 rounded shadow-xs">ESC</kbd>
    </div>
  </div>

  <!-- Right Header Actions -->
  <div class="flex items-center gap-3">
    <!-- Global Privacy Mask Toggle Button in Navbar -->
    <button id="nav-privacy-btn" onclick="UI.togglePrivacy()" 
            class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition-colors border border-slate-200 shadow-xs" 
            title="Toggle sensitive metrics visibility">
      <span id="nav-privacy-icon" class="material-symbols-outlined text-base leading-none">visibility_off</span>
      <span id="nav-privacy-label">Hide Values</span>
    </button>

    <!-- User Profile Pill -->
    <div class="flex items-center gap-2 pl-3 border-l border-slate-200">
      <div class="w-8 h-8 rounded-full bg-slate-900 text-emerald-400 flex items-center justify-center font-bold text-xs">
        <span id="user-avatar-initial">H</span>
      </div>
      <button onclick="Auth.logout()" title="Logout" class="ml-2 text-slate-400 hover:text-rose-600 p-1 rounded hover:bg-slate-100 transition-colors">
        <span class="material-symbols-outlined text-lg leading-none">logout</span>
      </button>
    </div>
  </div>
</header>

    <!-- Main Viewport Container -->
    <main class="w-full pt-16 min-h-screen bg-slate-50/60">
      <div id="alert-host" class="px-8 pt-4"></div>
      <div id="app-viewport" class="p-8"></div>
    </main>
  </div>

  <!-- Hidden Thermal Invoice Container -->
  <div id="print-container"></div>

  <!-- 3. Local Vendor Scripts -->
  <script src="/js/vendor/bootstrap.bundle.min.js"></script>
  
  <!-- 4. Application Scripts -->
  <script src="/js/reports.js"></script>
  <script src="/js/pos.js"></script>
  <script src="/js/sales.js"></script>
  <script src="/js/purchases.js"></script>
  <script src="/js/stock.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
